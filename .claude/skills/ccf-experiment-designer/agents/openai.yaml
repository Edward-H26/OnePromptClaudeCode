interface:
  display_name: "CCF Experiment Designer"
  short_description: "Design experiments and build evidence-bound result tables/figure specs from supplied real values; never invent results."
  default_prompt: "Run $ccf-humanization first, then use $ccf-experiment-designer for the smallest sufficient experiment package with internally verified full methods, non-duplicative smoke checks, and real-result evidence structure. Describe the actual method naturally in publication text without engineering-status language."
